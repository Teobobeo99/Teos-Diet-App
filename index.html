<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Teo Diet">
  <meta name="theme-color" content="#f2e8cf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1410" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Teo Diet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/dash.css">
  <link rel="stylesheet" href="css/weight.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true">▓▒░</span>
    <h1 id="title">Today</h1>
    <button id="sync-dot" class="sync-dot" hidden aria-label="Sync status"></button>
  </header>

  <main>
    <section id="tab-today" class="tab active" aria-label="Today"></section>
    <section id="tab-dash" class="tab" aria-label="Dashboard"></section>
    <section id="tab-weight" class="tab" aria-label="Weight"></section>
    <section id="tab-history" class="tab" aria-label="History"></section>
    <section id="tab-settings" class="tab" aria-label="Settings"></section>
  </main>

  <nav class="tabbar">
    <button data-tab="today" class="active">Log</button>
    <button data-tab="dash">Week</button>
    <button data-tab="weight">Lbs</button>
    <button data-tab="history">Past</button>
    <button data-tab="settings">Setup</button>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
